<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的衣柜 · Wardrobe AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>我的衣柜</h1>
    <p>Wardrobe AI · 尺码有数，买衣不纠结</p>
  </div>
</header>

<main>
  <!-- 速查条 -->
  <section>
    <div class="quickbar" id="quickbar"></div>
    <p class="hint">尺寸单位为厘米（cm）。数字以每件单品的实测记录为准，买新衣服时直接对着挑。</p>
  </section>

  <!-- 衣柜列表 -->
  <section id="items-section">
    <h2>衣柜</h2>
    <div class="filters">
      <button type="button" data-filter="全部" class="active">全部</button>
      <button type="button" data-filter="毛衣">毛衣</button>
      <button type="button" data-filter="T恤">T恤</button>
      <button type="button" data-filter="外套">外套</button>
      <button type="button" data-filter="衬衫">衬衫</button>
      <button type="button" data-filter="卫衣">卫衣</button>
      <button type="button" data-filter="裤子">裤子</button>
      <button type="button" data-filter="鞋子">鞋子</button>
    </div>
    <p class="hint" id="item-count"></p>
    <div class="items" id="items"></div>
    <p style="margin-top:12px;"><button type="button" id="load-example-btn">载入示例数据</button>
    <span class="hint">示例数据为占位内容，清空后可导入自己的衣柜。</span></p>
  </section>
</main>

<footer>
  <button type="button" id="export-btn">导出 JSON</button>
  <label style="margin:0;display:inline-block;">
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <button type="button" onclick="document.getElementById('import-file').click()">导入 JSON</button>
  </label>
  <br><br>
  Wardrobe AI · 静态展示页，无后端、无账号。数据只在你自己的 Personal Agent 手里，网站不持有数据；浏览器里只是用于展示的临时副本。加衣服、尺码建议、穿搭提醒都在 Personal Agent 聊天里完成。<br>
  <a href="https://github.com/QinCool/wardrobe-ai">GitHub：QinCool/wardrobe-ai</a>
</footer>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
